services:
  studio:
    build: .
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8000}:8000"
    volumes:
      - studio-data:/data
      - whisper-models:/models
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5))['worker']"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  studio-data:
  whisper-models:
