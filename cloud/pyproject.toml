[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-cloud"
version = "0.1.0"
description = "Personal Alibaba Cloud transcription library and local ingestion"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "oss2>=2.19,<3",
  "tablestore>=6,<7",
  "alibabacloud-fnf20190315>=2,<3",
  "pyopenssl>=26,<27",
]

[project.optional-dependencies]
ingest = ["bilibili-audio-scraper"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
infra = [
    "alibabacloud-ros20190910>=3,<4",
]

[tool.uv.sources]
bilibili-audio-scraper = { path = "../audio-scraper", editable = true }

[project.scripts]
transcript-ingest = "transcript_cloud.ingest:main"
transcript-cloud-studio = "transcript_cloud.local:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["transcript_cloud"]
