[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilibili-transcript"
version = "0.1.0"
description = "Transcribe Bilibili livestream recordings to text"
requires-python = ">=3.9"
dependencies = [
    "bilibili-audio-scraper",
    "faster-whisper>=1.0.0",
    "av>=10.0.0,<19.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]

[tool.uv.sources]
bilibili-audio-scraper = { path = "audio-scraper", editable = true }

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
transcript-web = "bilibili_transcript.web.app:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
